crons:
  - name: daily-digest
    description: "Sends daily payment digest email to the business owner at 9:00pm IST"
    cron: "0 21 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
