services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - ./data/mongo:/data/db
    ports:
      - "27017:27017"

  backend:
    build:
      context: ..
      dockerfile: local-runner/Dockerfile.backend
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      MONGO_URL: "mongodb://mongo:27017"
      DB_NAME: "payverify"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # MODE:
      # - "true"  = MOCK: no real Playwright, verify decided by UTR parity.
      #             Use this to explore the dashboard and test the pipeline.
      # - "false" = LIVE: Playwright drives real Chromium for WhatsApp Web
      #             + GPay Business. Google frequently blocks the first login;
      #             you may need to complete 2FA on your phone.
      # Default: true so first-time users can validate the app immediately.
      # Flip to "false" when you are ready to connect real accounts.
      BOT_MOCK_MODE: "${BOT_MOCK_MODE:-true}"
      # Persistent browser profiles so QR/2FA survive restarts
      WA_PROFILE_DIR: "/data/whatsapp_profile"
      GPAY_PROFILE_DIR: "/data/gpay_profile"
      EMERGENT_LLM_KEY: "${EMERGENT_LLM_KEY}"
      EMERGENT_EMAIL_KEY: "${EMERGENT_EMAIL_KEY}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-PayVerify Bot}"
      WEBHOOK_CRON_SECRET: "${WEBHOOK_CRON_SECRET}"
      GPAY_ENC_KEY: "${GPAY_ENC_KEY}"
    volumes:
      - ./data/browser:/data
    ports:
      - "8001:8001"

  frontend:
    image: node:20-slim
    working_dir: /app/frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      REACT_APP_BACKEND_URL: "http://localhost:8001"
      WDS_SOCKET_PORT: "0"
    command: sh -c "corepack enable && yarn install --frozen-lockfile && yarn start"
    volumes:
      - ../frontend:/app/frontend
    ports:
      - "3000:3000"
